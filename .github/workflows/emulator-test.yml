{
  "name": "Emulator smoke test",
  "on": {"push": {}, "workflow_dispatch": {}},
  "jobs": {
    "smoke": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 40,
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
        {"name": "Enable KVM", "run": "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules; sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm"},
        {"name": "Install Android SDK pieces", "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true; \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" \"platforms;android-30\" \"build-tools;34.0.0\" \"cmake;3.22.1\" \"ndk;25.1.8937393\""},
        {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.2.1"}},
        {"name": "Build debug APK", "run": "gradle --no-daemon assembleDebug"},
        {"name": "Make test ROM", "run": "mkdir -p build && python3 tools/emulator_test/make_rom.py build/test.gb"},
        {"name": "Run on emulator", "uses": "reactivecircus/android-emulator-runner@v2", "with": {
          "api-level": 30, "target": "google_apis", "arch": "x86_64", "profile": "pixel_c",
          "emulator-options": "-no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none",
          "disable-animations": true,
          "script": "sh tools/emulator_test/smoke.sh"}},
        {"if": "always()", "uses": "actions/upload-artifact@v4", "with": {"name": "emulator-logs", "path": "emulator-logs/"}}
      ]
    }
  }
}
